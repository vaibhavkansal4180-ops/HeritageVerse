<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EA" />
      <stop offset="100%" stop-color="#EBE5D8" />
    </linearGradient>
    <pattern id="patternGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#173F35" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#patternGrid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#173F35" stroke-width="1.5" stroke-opacity="0.2" rx="6" />
  <rect x="32" y="32" width="736" height="386" fill="none" stroke="#B85C38" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="6,4" rx="4" />

  <!-- Heritage Monument Icon Emblem -->
  <g transform="translate(400, 180)">
    <!-- Circular Aura -->
    <circle r="60" fill="#173F35" fill-opacity="0.06" />
    <circle r="48" fill="#FFFFFF" stroke="#173F35" stroke-width="1.5" stroke-opacity="0.25" />
    
    <!-- Architectural Monument Silhouette -->
    <!-- Dome & Finial -->
    <path d="M 0 -36 L 0 -42 M -3 -42 L 3 -42" stroke="#173F35" stroke-width="2" stroke-linecap="round" />
    <path d="M -18 -18 C -18 -32 18 -32 18 -18 Z" fill="#173F35" fill-opacity="0.8" />
    <!-- Pillars and Pediment -->
    <path d="M -26 -16 L 26 -16 L 22 -10 L -22 -10 Z" fill="#2F6658" />
    <rect x="-22" y="-10" width="4" height="26" fill="#173F35" fill-opacity="0.85" rx="1" />
    <rect x="-10" y="-10" width="4" height="26" fill="#173F35" fill-opacity="0.85" rx="1" />
    <rect x="6" y="-10" width="4" height="26" fill="#173F35" fill-opacity="0.85" rx="1" />
    <rect x="18" y="-10" width="4" height="26" fill="#173F35" fill-opacity="0.85" rx="1" />
    <!-- Archway Center -->
    <path d="M -5 16 L -5 2 C -5 -4 5 -4 5 2 L 5 16 Z" fill="#F7F3EA" />
    <!-- Plinth Base -->
    <rect x="-30" y="16" width="60" height="5" fill="#2F6658" rx="1" />
    <rect x="-34" y="21" width="68" height="5" fill="#173F35" rx="1" />
  </g>

  <!-- Typography -->
  <text x="400" y="280" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#173F35" letter-spacing="1">
    HERITAGE ARCHIVE DOCUMENTATION
  </text>
  <text x="400" y="308" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#576B64" letter-spacing="0.5">
    Verified heritage photograph currently undergoing official survey
  </text>
  <text x="400" y="330" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B85C38" letter-spacing="1" text-transform="uppercase">
    Archaeological Survey of India &bull; Preservation Intelligence
  </text>
</svg>
